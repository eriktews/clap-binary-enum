[package]
name = "clap-binary-enum-derive"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "A generic wrapper for using two-variant enums as optional clap CLI flags"
license = "MIT OR Apache-2.0"  # standard dual-license for Rust crates
repository = "https://github.com/eriktews/clap-binary-enum"
keywords = ["clap", "cli", "enum", "flag", "args"]
categories = ["command-line-interface"]


[lib]
proc-macro = true  # required — marks this as a proc macro crate

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"